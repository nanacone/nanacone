<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>月額会員ログイン | ナナコネ</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="../CSS/login.css">
</head>

<body>

  <!-- Header -->
  <header class="login-header">
    <div class="login-header-inner">

      <a href="./top.html" class="login-logo">
        ナナコネ
      </a>

      <a href="./top.html" class="back-top">
        トップへ戻る
      </a>

    </div>
  </header>


  <!-- Main -->
  <main class="login-main">

    <section class="login-container">

      <div class="login-heading">

        <p class="section-label">
          MEMBER LOGIN
        </p>

        <h1>月額会員ログイン</h1>

        <p>
          登録したメールアドレスとパスワードを入力してください。
        </p>

      </div>


      <form id="login-form" class="login-form">

        <!-- メールアドレス -->
        <div class="form-group">

          <label for="login-email">
            メールアドレス
          </label>

          <input
            type="email"
            id="login-email"
            name="email"
            autocomplete="email"
            placeholder="example@email.com"
            required
          >

        </div>


        <!-- パスワード -->
        <div class="form-group">

         <label for="login-password">
  パスワード
</label>

<div class="password-wrap">

  <input
    type="password"
    id="login-password"
    name="password"
    autocomplete="current-password"
    placeholder="パスワードを入力"
    required
  >

</div>

<div class="password-show-option">
  <label>
    <input 
 type="checkbox"
 id="show-password"
>
    パスワードを表示する
  </label>
</div>

        <div class="password-help">
          <a href="./forgot-password.html">
  パスワードをお忘れですか？
</a>
        </div>


        <button type="submit" class="login-button">
          ログイン
        </button>

      </form>


      <!-- 新規登録 -->
      <div class="signup-area">

        <p>
          月額会員のアカウントをお持ちでない方
        </p>

        <a href="./signup.html" class="signup-link">
          アカウントを作成する
        </a>

      </div>

    </section>

  </main>


  <footer class="login-footer">
    <p>© 2026 ナナコネ</p>
  </footer>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/login.js"></script>

</body>
</html>
